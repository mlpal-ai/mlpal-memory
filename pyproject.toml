[project]
name = "mlpal-memory"
version = "0.1.0"
description = "Institutional memory graph for enterprises using MLPal — a temporal, ontology-typed knowledge graph updated on every platform interaction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pg = ["pgvector>=0.3", "psycopg2-binary>=2.9"]
# MCP surface extra — only the `mcp` deployment sidecar needs these (mcp_server.py guards the
# imports so the package stays installable without them). The deployed image must build with
# `.[mcp]` or `python -m mlpal_memory_graph.mcp_server` exits with "requires extras".
mcp = ["fastmcp>=3.2.4"]
# PDF ingestion (data plane: multimodal sources beyond text/markdown).
pdf = ["pypdf>=4"]
# Real semantic embeddings in-process (ONNX, no gateway key) — the OSS default retrieval path.
# Select with MLPAL_EMBEDDINGS_PROVIDER=local; first use downloads the model (~30MB, cached).
local-embeddings = ["fastembed>=0.4"]
# Optional production graph backends (swap-in GraphDrivers). Default driver needs none of these.
age = ["psycopg[binary]>=3.2"]
neo4j = ["neo4j>=5.26"]
falkordb = ["falkordb>=1.0"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    # so the offline suite can build the FastMCP server and assert its served tool list
    # (test_mcp_identity.py) — the read-only contract must be enforced in CI, not skipped.
    "fastmcp>=3.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpal_memory_graph"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "postgres: requires a real Postgres + pgvector; opt-in via MLPAL_TEST_POSTGRES_DSN (skipped otherwise)",
]
